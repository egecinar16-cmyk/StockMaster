
<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StockMaster | Hesap İşlemleri</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f1f5f9;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 950px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            background: white;
            border-radius: 18px;
            overflow: hidden;
            box-shadow: 0 15px 45px rgba(0,0,0,0.08);
        }

        .brand {
            background: #172554;
            color: white;
            padding: 55px 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .brand h1 {
            font-size: 32px;
            margin-bottom: 18px;
        }

        .brand p {
            color: #cbd5e1;
            line-height: 1.7;
        }

        .brand-icon {
            font-size: 48px;
            margin-bottom: 25px;
        }

        .content {
            padding: 45px 35px;
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
        }

        .tabs button {
            flex: 1;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #f1f5f9;
            color: #64748b;
            cursor: pointer;
            font-weight: bold;
        }

        .tabs button.active {
            background: #2563eb;
            color: white;
        }

        h2 {
            margin-bottom: 10px;
            font-size: 24px;
        }

        .subtitle {
            color: #64748b;
            margin-bottom: 25px;
            font-size: 14px;
        }

        .field {
            margin-bottom: 17px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 13px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 14px;
            border: 1px solid #dbe1ea;
            border-radius: 8px;
            outline: none;
            font-size: 14px;
        }

        input:focus {
            border-color: #2563eb;
        }

        .submit-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 8px;
        }

        .submit-btn:hover {
            background: #1d4ed8;
        }

        .message {
            margin-top: 17px;
            font-size: 14px;
            line-height: 1.5;
        }

        .hidden {
            display: none;
        }

        @media (max-width: 700px) {
            .container {
                grid-template-columns: 1fr;
            }

            .brand {
                padding: 30px;
            }

            .brand h1 {
                font-size: 26px;
            }

            .content {
                padding: 30px 22px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="brand">
        <div class="brand-icon">📦</div>
        <h1>StockMaster</h1>
        <p>
            Stoklarını yönet, siparişlerini takip et
            ve işletmenin performansını tek bir
            platform üzerinden kontrol et.
        </p>
    </div>

    <div class="content">

        <div class="tabs">
            <button id="loginTab" class="active" type="button">
                Giriş Yap
            </button>

            <button id="registerTab" type="button">
                Kayıt Ol
            </button>
        </div>

        <div id="loginPanel">
            <h2>Tekrar Hoş Geldin!</h2>
            <p class="subtitle">Hesabına giriş yap.</p>

            <form id="loginForm">

                <div class="field">
                    <label>Kullanıcı Adı</label>
                    <input
                        type="text"
                        name="username"
                        placeholder="Kullanıcı adın"
                        required
                    >
                </div>

                <div class="field">
                    <label>Şifre</label>
                    <input
                        type="password"
                        name="password"
                        placeholder="Şifren"
                        required
                    >
                </div>

                <button class="submit-btn" type="submit">
                    Giriş Yap
                </button>

            </form>
        </div>

        <div id="registerPanel" class="hidden">
            <h2>Hesap Oluştur</h2>
            <p class="subtitle">StockMaster'a hemen katıl.</p>

            <form id="registerForm">

                <div class="field">
                    <label>Kullanıcı Adı</label>
                    <input
                        type="text"
                        name="username"
                        minlength="3"
                        placeholder="Kullanıcı adın"
                        required
                    >
                </div>

                <div class="field">
                    <label>E-posta</label>
                    <input
                        type="email"
                        name="email"
                        placeholder="ornek@mail.com"
                        required
                    >
                </div>

                <div class="field">
                    <label>Şifre</label>
                    <input
                        type="password"
                        name="password"
                        minlength="8"
                        placeholder="En az 8 karakter"
                        required
                    >
                </div>

                <button class="submit-btn" type="submit">
                    Hesap Oluştur
                </button>

            </form>
        </div>

        <p id="message" class="message"></p>

    </div>
</div>

<script>
    const loginTab = document.getElementById("loginTab");
    const registerTab = document.getElementById("registerTab");

    const loginPanel = document.getElementById("loginPanel");
    const registerPanel = document.getElementById("registerPanel");

    const message = document.getElementById("message");

    function showLogin() {
        loginPanel.classList.remove("hidden");
        registerPanel.classList.add("hidden");

        loginTab.classList.add("active");
        registerTab.classList.remove("active");

        message.textContent = "";
    }

    function showRegister() {
        registerPanel.classList.remove("hidden");
        loginPanel.classList.add("hidden");

        registerTab.classList.add("active");
        loginTab.classList.remove("active");

        message.textContent = "";
    }

    loginTab.addEventListener("click", showLogin);
    registerTab.addEventListener("click", showRegister);

    document.getElementById("registerForm").addEventListener(
        "submit",
        async function(event) {
            event.preventDefault();

            const formData = new FormData(this);

            try {
                const response = await fetch("/auth/register", {
                    method: "POST",
                    body: formData
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.detail || "Kayıt başarısız.");
                }

                message.textContent = "Hesap oluşturuldu! Şimdi giriş yapabilirsin.";
                message.style.color = "green";

                this.reset();
                showLogin();

            } catch (error) {
                message.textContent = error.message;
                message.style.color = "red";
            }
        }
    );

    document.getElementById("loginForm").addEventListener(
        "submit",
        async function(event) {
            event.preventDefault();

            const formData = new FormData(this);

            try {
                const response = await fetch("/auth/login", {
                    method: "POST",
                    body: formData
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.detail || "Giriş başarısız.");
                }

                window.location.href = "/";

            } catch (error) {
                message.textContent = error.message;
                message.style.color = "red";
            }
        }
    );
</script>

</body>
</html>
